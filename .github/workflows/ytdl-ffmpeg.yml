name: build-ffmpeg

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TERMUX_PACKAGES_PIN: d53e42e0c52875ac69cfc9ff41b6c15d35b66153

jobs:
  build:
    name: ffmpeg for ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            termux_arch: aarch64
          - abi: armeabi-v7a
            termux_arch: arm
          - abi: x86_64
            termux_arch: x86_64
          - abi: x86
            termux_arch: i686

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout termux-packages at pinned commit
        run: |
          set -euxo pipefail
          rm -rf termux-packages
          git init termux-packages
          cd termux-packages
          git remote add origin https://github.com/termux/termux-packages.git
          git fetch --depth 1 origin ${{ env.TERMUX_PACKAGES_PIN }}
          git checkout FETCH_HEAD

      # Step 1: Discover all dependencies upfront
      - name: Discover all dependencies
        working-directory: termux-packages
        run: |
          set -euxo pipefail
          cat > find-all-deps.sh <<'EOF'
          #!/bin/bash
          set -euo pipefail

          TARGET_PKG="${1:-ffmpeg}"
          DEPS_FILE=$(mktemp)
          VISITED_FILE=$(mktemp)
          touch "$VISITED_FILE"

          # TERMUX_PKG_DEPENDS looks like:
          #   TERMUX_PKG_DEPENDS="libass, libx264 (>= 1:164), libvpx"
          # so strip quotes, split on commas, drop "(...)" version
          # constraints and trim whitespace to get bare package names.
          parse_deps() {
            grep -E '^TERMUX_PKG_DEPENDS=' "$1" \
              | sed -e 's/^.*="//;s/".*$//' \
              | tr ',' '\n' \
              | sed -e 's/(.*//' -e 's/^ *//;s/ *$//' \
              | grep -v '^$' || true
          }

          get_deps() {
            local pkg="$1"
            local build_script="packages/$pkg/build.sh"

            grep -qxF "$pkg" "$VISITED_FILE" && return 0
            echo "$pkg" >> "$VISITED_FILE"

            if [ -f "$build_script" ]; then
              while IFS= read -r dep; do
                [ -z "$dep" ] && continue
                echo "$dep" >> "$DEPS_FILE"
                get_deps "$dep"
              done < <(parse_deps "$build_script")
            fi
          }

          get_deps "$TARGET_PKG"
          sort -u "$DEPS_FILE" | grep -v "^$" > all-dependencies.txt || true

          echo "=== Complete dependency list ==="
          cat all-dependencies.txt
          echo "Total unique dependencies: $(wc -l < all-dependencies.txt)"
          EOF
          chmod +x find-all-deps.sh

          ./find-all-deps.sh ffmpeg

      # Step 2: Wire committed tarballs, then enforce full coverage.
      # Hermetic by design: there is NO network fallback. Every source the
      # build needs must already sit in .github/workflows/deps/, vendored
      # locally with scripts/vendor-termux-sources.ps1 (which verifies each
      # SHA256 against its recipe before you commit it).
      # For each tarball we find its recipe by longest prefix match and point
      # that recipe at the local file via termux_download's file://
      # passthrough. Only TERMUX_PKG_SRCURL is rewritten — the recipe's
      # TERMUX_PKG_SHA256 is left untouched so the pristine upstream tarball
      # still verifies exactly as recorded.
      - name: Use committed source tarballs
        working-directory: termux-packages
        run: |
          set -euxo pipefail
          mkdir -p downloads-pre
          shopt -s nullglob
          dep_files=("$GITHUB_WORKSPACE"/.github/workflows/deps/*)
          shopt -u nullglob
          real_files=()
          for f in "${dep_files[@]}"; do
            [ -f "$f" ] || continue
            case "$f" in *.gitkeep) continue ;; esac
            real_files+=("$f")
          done
          if [ ${#real_files[@]} -eq 0 ]; then
            echo "::error::No tarballs in .github/workflows/deps/ — run scripts/vendor-termux-sources.ps1 and commit the bundle first."
            ls -la "$GITHUB_WORKSPACE"/.github/workflows/deps/ || true
            exit 1
          fi

          # "tarball-prefix:recipe" pairs: every recipe name, plus the
          # upstream prefixes that differ from their recipe
          # (acl sources build Termux's libacl package, etc.).
          mapfile -t PREFIXMAP < <(
            for d in packages/*/; do
              r=$(basename "$d")
              echo "$r:$r"
            done
            printf '%s\n' \
              "acl:libacl" \
              "dav1d:libdav1d" \
              "srt:libsrt" \
              "openh264:libopenh264" \
              "x264:libx264" \
              "webrtc-audio-processing:libwebrtc-audio-processing"
          )

          resolve_recipe() {
            # $1 = tarball basename -> recipe dir name, or "" if none matches.
            # Longest prefix wins, so libx264 beats x264 on libx264-... names.
            # Handles '-' and '_' separators (x265_3.6.tar.gz) and the vendor
            # script's "<pkg>-<version>" names for version-only upstreams.
            local name="$1" best_len=0 best="" pair pre rec
            for pair in "${PREFIXMAP[@]}"; do
              pre="${pair%%:*}"; rec="${pair#*:}"
              if [ "$name" = "$pre" ] || [[ "$name" == "$pre"-* ]] || [[ "$name" == "$pre"_* ]]; then
                if [ ${#pre} -gt $best_len ] && [ -f "packages/$rec/build.sh" ]; then
                  best_len=${#pre}; best="$rec"
                fi
              fi
            done
            echo "$best"
          }

          point_recipe_at_file() {
            local build="$1" fname="$2"
            python3 - "$build" "$fname" <<'PY'
          import re, sys
          build, fname = sys.argv[1:3]
          src = f'TERMUX_PKG_SRCURL="file:///home/builder/termux-packages/downloads-pre/{fname}"'
          txt = open(build).read()
          new = re.sub(r'TERMUX_PKG_SRCURL=\(.*?\)', src, txt, flags=re.S)
          new = re.sub(r'TERMUX_PKG_SRCURL=.*', src, new)
          if new == txt:
              raise SystemExit(f'no TERMUX_PKG_SRCURL rewritten in {build}')
          open(build, 'w').write(new)
          PY
          }

          handled=""
          for f in "${real_files[@]}"; do
            name=$(basename "$f")
            pkg=$(resolve_recipe "$name")
            if [ -z "$pkg" ]; then
              echo "::warning::cannot map $name to any recipe — skipping"
              continue
            fi
            build="packages/$pkg/build.sh"
            # glob is alphabetical (.tar.gz before .tar.xz), so the FIRST file wins and
            # any alternate compression of the same package is skipped
            case " $handled " in *" $pkg "*)
              echo "::notice::$pkg already handled — skipping $name"
              continue ;;
            esac
            handled="$handled $pkg"
            cp "$f" "downloads-pre/$name"
            point_recipe_at_file "$build" "$name"
            echo "::notice::$name -> $pkg"
            grep -nE "^TERMUX_PKG_SRCURL=" "$build"
          done

          # Strict coverage: every dependency whose recipe fetches an http(s)
          # tarball must have been wired to a committed file above. Git-only
          # recipes need nothing. Gaps fail HERE, not an hour into docker.
          gaps=""
          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            build="packages/$pkg/build.sh"
            [ -f "$build" ] || continue
            srcurl_line=$(grep -E '^TERMUX_PKG_SRCURL=' "$build" || true)
            case "$srcurl_line" in
              *file://*) continue ;;   # vendored above
              *http*) gaps="$gaps $pkg" ;;
              *) continue ;;           # git-only / empty: nothing to vendor
            esac
          done < all-dependencies.txt
          if [ -n "$gaps" ]; then
            echo "::error::Unvendored sources:$gaps — run scripts/vendor-termux-sources.ps1 and commit the missing tarballs."
            exit 1
          fi
          echo "Coverage OK ($(( $(wc -w <<<"$handled") )) recipes wired to committed tarballs)."

          # ffmpeg does not need Android activity-manager wrappers, but termux-tools pulls
          # them in as bootstrap/runtime conveniences. termux-am builds an APK with Gradle
          # and tries to install SDK components inside the Docker image, which fails on CI.
          if [ -f packages/termux-tools/build.sh ]; then
            sed -i -E 's/[[:space:]]*,?[[:space:]]*termux-am([[:space:]]*\([^)]*\))?//g' packages/termux-tools/build.sh
            sed -i -E 's/[[:space:]]*,?[[:space:]]*termux-am-socket([[:space:]]*\([^)]*\))?//g' packages/termux-tools/build.sh
            sed -i -E 's/,,/,/g; s/\(\s*,/\(/; s/,\s*\)/\)/' packages/termux-tools/build.sh
            grep -nE "^TERMUX_PKG_DEPENDS=" packages/termux-tools/build.sh
          fi

      # Mirrors upstream BUILD_FFMPEG.md from youtubedl-android. The custom TERMUX_PREFIX is
      # essential: stock Termux binaries bake /data/data/com.termux/... into their rpath and
      # cannot locate their own shared libs from another app's data dir.
      # ~/.termux-build is bind-mounted into the container and persists between attempts —
      # so the clean runs ONCE up front (it wipes that dir), and each retry keeps every
      # dependency already downloaded, only fetching what's left.
      - name: Build ffmpeg package in Termux docker (with retries)
        working-directory: termux-packages
        run: |
          set -euxo pipefail
          cat > build-ffmpeg.sh <<'EOF'
          #!/bin/bash
          set -e
          export TERMUX_ARCH=${{ matrix.termux_arch }}
          export TERMUX_PREFIX=/data/youtubedl-android/usr
          export TERMUX_ANDROID_HOME=/data/youtubedl-android/home
          ./build-package.sh -a $TERMUX_ARCH ffmpeg
          EOF
          chmod +x build-ffmpeg.sh
          ./scripts/run-docker.sh ./clean.sh
          SUCCESS=0
          for attempt in 1 2 3; do
            echo "::group::Build attempt $attempt"
            if ./scripts/run-docker.sh ./build-ffmpeg.sh; then
              SUCCESS=1
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed; cache persists, retrying after cooldown..."
            sleep 30
          done
          test "$SUCCESS" = "1"

      # Package exactly like upstream does: extract every produced deb (dev/static variants
      # removed), keep the custom-prefix tree. Binaries are shipped separately as
      # libffmpeg.so/libffprobe.so (Android jniLibs launchers); the zip stays libs-only
      # to match the current ffmpeg/.../jniLibs layout consumed by FFmpeg.kt.
      - name: Package into jniLibs layout
        working-directory: termux-packages
        run: |
          set -euxo pipefail
          cd debs
          # NOTE: '*-dev_*.deb' on purpose — '*dev*' would also match
          # libavdevice (the runtime lib ffmpeg needs).
          find . -type f \( -name '*-dev_*.deb' -o -name '*-static_*.deb' \) -delete
          mkdir -p extracted
          for f in ./*.deb; do dpkg-deb -x "$f" extracted/; done
          PKG=$(find extracted -type d -path '*youtubedl-android/usr' | head -1)
          test -n "$PKG"
          STAGE=stage/usr
          mkdir -p "$STAGE/lib" "$STAGE/bin"
          cp -a "$PKG/lib/." "$STAGE/lib/"
          cp -a "$PKG/bin/." "$STAGE/bin/" 2>/dev/null || true
          FFMPEG_BIN=$(find "$PKG" -type f -name ffmpeg -perm -u+x | head -1)
          FFPROBE_BIN=$(find "$PKG" -type f -name ffprobe -perm -u+x | head -1)
          test -n "$FFMPEG_BIN" && test -n "$FFPROBE_BIN"
          mkdir -p out/${{ matrix.abi }}
          cd stage
          zip --symlinks -r ../out/${{ matrix.abi }}/libffmpeg.zip.so usr
          cd ..
          install -m 755 "$FFMPEG_BIN" "out/${{ matrix.abi }}/libffmpeg.so"
          install -m 755 "$FFPROBE_BIN" "out/${{ matrix.abi }}/libffprobe.so"
          # record what we actually built, for the changelog
          # (can't exec the cross-compiled binary on x86_64 runners, so use strings)
          (strings "$FFMPEG_BIN" | grep -m1 'ffmpeg version') || true
          ls -lh out/${{ matrix.abi }}/

      - name: Upload per-ABI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.abi }}
          path: termux-packages/out/${{ matrix.abi }}/

  assemble:
    name: Assemble ffmpeg-jniLibs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Download all ABI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: ffmpeg-*
          merge-multiple: true

      - name: Arrange into module layout and zip
        run: |
          set -euxo pipefail
          mkdir -p ffmpeg-jniLibs
          # Each per-ABI artifact now contains exactly the 3 files for
          # that ABI; merge-multiple puts them under artifacts/<abi>/.
          # Tolerate the old out/<abi>/ nesting if present.
          if [ -d artifacts/out ]; then
            cp -a artifacts/out/. ffmpeg-jniLibs/
          else
            cp -a artifacts/. ffmpeg-jniLibs/
          fi
          # Fail fast unless all 4 ABIs arrived.
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -f "ffmpeg-jniLibs/$abi/libffmpeg.so" || { echo "::error::missing $abi/libffmpeg.so"; find ffmpeg-jniLibs | sort; exit 1; }
            test -f "ffmpeg-jniLibs/$abi/libffmpeg.zip.so" || { echo "::error::missing $abi/libffmpeg.zip.so"; find ffmpeg-jniLibs | sort; exit 1; }
            test -f "ffmpeg-jniLibs/$abi/libffprobe.so" || { echo "::error::missing $abi/libffprobe.so"; find ffmpeg-jniLibs | sort; exit 1; }
          done
          find ffmpeg-jniLibs -type f | sort
          zip -r ffmpeg-jniLibs.zip ffmpeg-jniLibs

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-jniLibs
          path: ffmpeg-jniLibs.zip
