name: build-ffmpeg

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pin of termux-packages master at ffmpeg 8.1. Bump periodically with:
  #   curl -s "https://api.github.com/repos/termux/termux-packages/commits?path=packages/ffmpeg/build.sh&per_page=1" | grep '"sha"' | head -1
  TERMUX_PACKAGES_PIN: a95402c35e8bbb2ef5d830093357d7938adaa0f8

jobs:
  build:
    name: ffmpeg for ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            termux_arch: aarch64
          - abi: armeabi-v7a
            termux_arch: arm
          - abi: x86_64
            termux_arch: x86_64
          - abi: x86
            termux_arch: i686

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Resolve latest ffmpeg 8.1 Termux pin
        id: resolve-pin
        run: |
          set -euxo pipefail
          # If the hardcoded pin looks like a placeholder (not 40 hex chars), resolve live.
          PIN="${{ env.TERMUX_PACKAGES_PIN }}"
          if ! echo "$PIN" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::warning::TERMUX_PACKAGES_PIN looks invalid, resolving latest ffmpeg commit..."
            PIN=$(curl -sf \
              "https://api.github.com/repos/termux/termux-packages/commits?path=packages/ffmpeg/build.sh&per_page=1" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['sha'])")
            echo "Resolved PIN: $PIN"
          fi
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"

      - name: Checkout termux-packages at pinned commit
        run: |
          set -euxo pipefail
          rm -rf termux-packages
          git init termux-packages
          cd termux-packages
          git remote add origin https://github.com/termux/termux-packages.git
          git fetch --depth 1 origin ${{ steps.resolve-pin.outputs.pin }}
          git checkout FETCH_HEAD

      # Step 1: Discover all dependencies upfront
      - name: Discover all dependencies
        working-directory: termux-packages
        run: |
          set -euxo pipefail
          cat > find-all-deps.sh <<'EOF'
          #!/bin/bash
          set -euo pipefail

          TARGET_PKG="${1:-ffmpeg}"
          DEPS_FILE=$(mktemp)
          VISITED_FILE=$(mktemp)
          touch "$VISITED_FILE"

          parse_deps() {
            grep -E '^TERMUX_PKG_DEPENDS=' "$1" \
              | sed -e 's/^.*="//;s/".*$//' \
              | tr ',' '\n' \
              | sed -e 's/(.*//' -e 's/^ *//;s/ *$//' \
              | grep -v '^$' || true
          }

          get_deps() {
            local pkg="$1"
            local build_script="packages/$pkg/build.sh"

            grep -qxF "$pkg" "$VISITED_FILE" && return 0
            echo "$pkg" >> "$VISITED_FILE"

            if [ -f "$build_script" ]; then
              while IFS= read -r dep; do
                [ -z "$dep" ] && continue
                echo "$dep" >> "$DEPS_FILE"
                get_deps "$dep"
              done < <(parse_deps "$build_script")
            fi
          }

          get_deps "$TARGET_PKG"
          sort -u "$DEPS_FILE" | grep -v "^$" > all-dependencies.txt || true

          echo "=== Complete dependency list ==="
          cat all-dependencies.txt
          echo "Total unique dependencies: $(wc -l < all-dependencies.txt)"
          EOF
          chmod +x find-all-deps.sh
          ./find-all-deps.sh ffmpeg

