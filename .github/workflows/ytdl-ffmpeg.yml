      #       sed -i -E 's/[[:space:]]*,?[[:space:]]*termux-am-socket([[:space:]]*\([^)]*\))?//g' packages/termux-tools/build.sh
      #       sed -i -E 's/,,/,/g; s/\(\s*,/\(/; s/,\s*\)/\)/' packages/termux-tools/build.sh
