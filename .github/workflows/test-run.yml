name: build-ffmpeg

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pin of termux-packages master. Bump periodically to get newer ffmpeg.
  # Grab latest with:
  #   curl -s "https://api.github.com/repos/termux/termux-packages/commits?path=packages/ffmpeg/build.sh&per_page=1" | python3 -c "import sys,json;print(json.load(sys.stdin)[0]['sha'])"
  TERMUX_PACKAGES_PIN: a95402c35e8bbb2ef5d830093357d7938adaa0f8

jobs:
  build:
    name: ffmpeg for ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            termux_arch: aarch64
          - abi: armeabi-v7a
            termux_arch: arm
          - abi: x86_64
            termux_arch: x86_64
          - abi: x86
            termux_arch: i686

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout termux-packages at pinned commit
        run: |
          set -euxo pipefail
          rm -rf termux-packages
          git init termux-packages
          cd termux-packages
          git remote add origin https://github.com/termux/termux-packages.git
          git fetch --depth 1 origin ${{ env.TERMUX_PACKAGES_PIN }}
          git checkout FETCH_HEAD

      # Blanket-replace every dead/flaky upstream mirror across all recipes.
      # Two separate domains:
      #   savannah.gnu.org  — GNU-hosted projects (attr, acl, ...)
      #   savannah.nongnu.org — non-GNU projects
      # ftp:// -> https:// applied globally since FTP is unreliable on CI.
      - name: Patch flaky upstream mirrors in all recipes
        working-directory: termux-packages
        run: |
          set -euxo pipefail
          find packages -name "build.sh" | xargs sed -i \
            -e 's|http://download\.savannah\.gnu\.org/releases/|https://download-mirror.savannah.gnu.org/releases/|g' \
            -e 's|https://download\.savannah\.gnu\.org/releases/|https://download-mirror.savannah.gnu.org/releases/|g' \
            -e 's|http://download\.savannah\.nongnu\.org/releases/|https://download-mirror.savannah.nongnu.org/releases/|g' \
            -e 's|https://download\.savannah\.nongnu\.org/releases/|https://download-mirror.savannah.nongnu.org/releases/|g' \
            -e 's|ftp://ftp\.gnu\.org/gnu/|https://mirrors.kernel.org/gnu/|g' \
            -e 's|http://ftp\.gnu\.org/gnu/|https://mirrors.kernel.org/gnu/|g' \
            -e 's|https://ftp\.gnu\.org/gnu/|https://mirrors.kernel.org/gnu/|g' \
            -e 's|ftp://ftp\.gnu\.org/pub/gnu/|https://mirrors.kernel.org/gnu/|g' \
            -e 's|http://ftp\.gnu\.org/pub/gnu/|https://mirrors.kernel.org/gnu/|g' \
            -e 's|https://ftpmirror\.gnu\.org/|https://mirrors.kernel.org/gnu/|g' \
            -e 's|http://ftpmirror\.gnu\.org/|https://mirrors.kernel.org/gnu/|g'

          echo "--- Spot-check patched recipes ---"
          grep -nE "TERMUX_PKG_SRCURL" packages/attr/build.sh packages/acl/build.sh 2>/dev/null || true

      # Strip termux-am — builds an APK via Gradle, completely unnecessary for ffmpeg.
      # Only gets dragged in via termux-tools as a convenience dependency.
      - name: Strip termux-am from termux-tools dependencies
        working-directory: termux-packages
        run: |
          set -euxo pipefail
          if [ -f packages/termux-tools/build.sh ]; then
            sed -i -E 's/[[:space:]]*,?[[:space:]]*termux-am([[:space:]]*\([^)]*\))?//g' packages/termux-tools/build.sh
            sed -i -E 's/[[:space:]]*,?[[:space:]]*termux-am-socket([[:space:]]*\([^)]*\))?//g' packages/termux-tools/build.sh
            sed -i -E 's/,,/,/g; s/\(\s*,/\(/; s/,\s*\)/\)/' packages/termux-tools/build.sh
            grep -nE "^TERMUX_PKG_DEPENDS=" packages/termux-tools/build.sh
          fi

      # Custom TERMUX_PREFIX is essential: stock Termux binaries bake
      # /data/data/com.termux/... into their rpath and cannot locate their own
      # shared libs from another app's data dir.
      # ~/.termux-build is bind-mounted into the container and persists between
      # attempts — clean runs ONCE up front, retries reuse the cache.
      - name: Build ffmpeg package in Termux docker (with retries)
        working-directory: termux-packages
        run: |
          set -euxo pipefail
          cat > build-ffmpeg.sh <<'EOF'
          #!/bin/bash
          set -e
          export TERMUX_ARCH=${{ matrix.termux_arch }}
          export TERMUX_PREFIX=/data/youtubedl-android/usr
          export TERMUX_ANDROID_HOME=/data/youtubedl-android/home
          ./build-package.sh -a $TERMUX_ARCH ffmpeg
          EOF
          chmod +x build-ffmpeg.sh
          ./scripts/run-docker.sh ./clean.sh
          SUCCESS=0
          for attempt in 1 2 3; do
            echo "::group::Build attempt $attempt"
            if ./scripts/run-docker.sh ./build-ffmpeg.sh; then
              SUCCESS=1
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed; cache persists, retrying after cooldown..."
            sleep 30
          done
          test "$SUCCESS" = "1"

      # NOTE: '*-dev_*.deb' on purpose — '*dev*' would also match libavdevice.
      - name: Package into jniLibs layout
        working-directory: termux-packages
        run: |
          set -euxo pipefail
          cd debs
          find . -type f \( -name '*-dev_*.deb' -o -name '*-static_*.deb' \) -delete
          mkdir -p extracted
          for f in ./*.deb; do dpkg-deb -x "$f" extracted/; done
          PKG=$(find extracted -type d -path '*youtubedl-android/usr' | head -1)
          test -n "$PKG"
          STAGE=stage/usr
          mkdir -p "$STAGE/lib" "$STAGE/bin"
          cp -a "$PKG/lib/." "$STAGE/lib/"
          cp -a "$PKG/bin/." "$STAGE/bin/" 2>/dev/null || true
          FFMPEG_BIN=$(find "$PKG" -type f -name ffmpeg -perm -u+x | head -1)
          FFPROBE_BIN=$(find "$PKG" -type f -name ffprobe -perm -u+x | head -1)
          test -n "$FFMPEG_BIN" && test -n "$FFPROBE_BIN"
          mkdir -p out/${{ matrix.abi }}
          cd stage
          zip --symlinks -r ../out/${{ matrix.abi }}/libffmpeg.zip.so usr
          cd ..
          install -m 755 "$FFMPEG_BIN" "out/${{ matrix.abi }}/libffmpeg.so"
          install -m 755 "$FFPROBE_BIN" "out/${{ matrix.abi }}/libffprobe.so"
          (strings "$FFMPEG_BIN" | grep -m1 'ffmpeg version') || true
          ls -lh out/${{ matrix.abi }}/

      - name: Upload per-ABI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.abi }}
          path: termux-packages/out/${{ matrix.abi }}/

  assemble:
    name: Assemble ffmpeg-jniLibs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Download all ABI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: ffmpeg-*
          merge-multiple: true

      - name: Arrange into module layout and zip
        run: |
          set -euxo pipefail
          mkdir -p ffmpeg-jniLibs
          if [ -d artifacts/out ]; then
            cp -a artifacts/out/. ffmpeg-jniLibs/
          else
            cp -a artifacts/. ffmpeg-jniLibs/
          fi
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -f "ffmpeg-jniLibs/$abi/libffmpeg.so"     || { echo "::error::missing $abi/libffmpeg.so";     find ffmpeg-jniLibs | sort; exit 1; }
            test -f "ffmpeg-jniLibs/$abi/libffmpeg.zip.so" || { echo "::error::missing $abi/libffmpeg.zip.so"; find ffmpeg-jniLibs | sort; exit 1; }
            test -f "ffmpeg-jniLibs/$abi/libffprobe.so"    || { echo "::error::missing $abi/libffprobe.so";    find ffmpeg-jniLibs | sort; exit 1; }
          done
          find ffmpeg-jniLibs -type f | sort
          zip -r ffmpeg-jniLibs.zip ffmpeg-jniLibs

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-jniLibs
          path: ffmpeg-jniLibs.zip
